<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .highlight { background-color:#FFFF00; }
      .right-column { margin-top: 35px; }
      body { min-height: 100vh; display: flex; flex-direction: column; }
      main { flex: 1 0 auto; }
      .app-footer { flex-shrink: 0; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous">
    <title>Aegis AI</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" title="Product Security Agent" href="/">
            Aegis AI - Console
        </a>
    </div>
</nav>
<main class="container-fluid py-3">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h1>Console</h1>
                <div class="mb-3">
                    <label for="agent" class="form-label">agent:</label>
                    <select id="agent" name="agent" class="form-select">
                        <option>redhat</option>
                        <option>public</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="feature" class="form-label">feature:</label>
                    <select id="feature" name="feature" class="form-select">
                        <option></option>
                        <option>suggest-impact</option>
                        <option>suggest-cwe</option>
                        <option>suggest-description</option>
                        <option>suggest-statement</option>
                        <option>cvss-diff</option>
                        <option>suggest-mitigation</option>
                    </select>
                </div>
                <hr/>
                <form action="/console" method="post">
                    <div class="mb-3">
                        <label for="user_instruction" class="form-label">User instruction:</label>
                        <textarea id="user_instruction" name="user_instruction" rows="8" class="form-control" placeholder="Type your LLM prompt here...">{{ user_instruction }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="goals" class="form-label">Goals:</label>
                        <textarea id="goals" name="goals" rows="5" class="form-control" placeholder="Type your goals here...">{{ goals }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="rules" class="form-label">Rules:</label>
                        <textarea id="rules" name="rules" rows="5" class="form-control" placeholder="Type your rules here...">{{ rules }}</textarea>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">Generate Answer</button>
                    </div>
                </form>
            </div>

            <div class="col-md-6 right-column">
                <hr/>
                <div class="response-section">
                    <div class="row">
                        <div class="col-md-4">
                            <label for="confidence" class="form-label">confidence:</label>
                            <input id="confidence" value="{{ confidence }}" class="form-control" readonly/>
                        </div>
                    </div>
                    <br/>
                    <div class="mb-3">
                        <label for="tools_used" class="form-label">tools used:</label>
                        <input id="tools_used" value="{{ tools_used }}" class="form-control" readonly/>
                    </div>

                    <div class="mb-3">
                        <label for="explanation" class="form-label">explanation:</label>
                        <textarea id="explanation" rows="10" class="form-control" expanded>{{ explanation }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="answer" class="form-label">answer:</label>
                        <textarea id="answer" rows="10" class="form-control" expanded>{{ answer }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="raw_output" class="form-label">debug:</label>
                        <textarea id="raw_output" rows="10" class="form-control" expanded>{{ raw_output }}</textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="app-footer container-fluid border-top py-3 bg-white">
    <div class="text-center" style="font-size:120%; padding-bottom: 5px">
        Copyright © 2025 Red Hat, Inc. All rights reserved.
        |
        Version: {{ version }}
        |
        <a href="https://github.com/RedHatProductSecurity/aegis-ai/issues"
           rel="noopener noreferrer" target="_blank">
            Report Issue/Enhancement
        </a>
    </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js" integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw==" crossorigin="anonymous"></script>
</body>
</html>
