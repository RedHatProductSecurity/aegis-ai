apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: aegis-build-pipeline
spec:
  description: |
    This pipeline is ideal for building container images from a Containerfile while maintaining trust after pipeline customization.

    _Uses `buildah` to create a container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
    This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-oci-ta?tab=tags)_
  params:
  - description: Source Repository URL
    name: git-url
    type: string
  - default: ""
    description: Revision of the Source Repository
    name: revision
    type: string
  - description: Fully Qualified Output Image
    name: output-image
    type: string
  - default: .
    description: Path to the source code of an application's component from where to build image.
    name: path-context
    type: string
  - default: Containerfile.eval
    description: Path to the Dockerfile inside the context specified by parameter path-context
    name: dockerfile
    type: string
  - default: "false"
    description: Skip checks against built image
    name: skip-checks
    type: string
  - default: "false"
    description: Execute the build with network isolation
    name: hermetic
    type: string
  - default: ""
    description: Build dependencies to be prefetched
    name: prefetch-input
    type: string
  - default: ""
    description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: image-expires-after
    type: string
  - default: "false"
    description: Build a source image.
    name: build-source-image
    type: string
  - default: "false"
    description: Add built image into an OCI image index
    name: build-image-index
    type: string
  - default: []
    description: Array of --build-arg values ("arg=value" strings) for buildah
    name: build-args
    type: array
  - default: ""
    description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
    name: build-args-file
    type: string
  - default: "false"
    description: Whether to enable privileged mode, should be used only with remote VMs
    name: privileged-nested
    type: string
  - name: ADDITIONAL_TAGS
    description: Additional tags that will be applied to the image in the registry.
    type: array
    default: []
  - name: buildah-format
    default: docker
    type: string
    description: The format for the resulting image's mediaType. Valid values are oci or docker.
  - name: enable-cache-proxy
    default: 'false'
    description: Enable cache proxy configuration
    type: string
  - name: evals-skip-keyword
    default: ""
    description: Substring that skips evals when found in the PR body (GitHub API). Empty disables; set on PR runs only.
    type: string
  - name: evals-skip-github-owner
    default: ""
    description: PaC template repo_owner (PR runs).
    type: string
  - name: evals-skip-github-repo
    default: ""
    description: PaC template repo_name (PR runs).
    type: string
  - name: evals-skip-pull-request-number
    default: ""
    description: PaC template pull_request_number (PR runs).
    type: string
  - name: enable-package-registry-proxy
    default: 'true'
    description: Use the package registry proxy when prefetching dependencies
    type: string
  - name: sast-target-dirs
    type: string
    default: docs,evals,scripts,src,tests
    description: Target directories to scan with SAST tools. Multiple values should be separated with commas.
  results:
  - description: ""
    name: IMAGE_URL
    value: $(tasks.build-image-index.results.IMAGE_URL)
  - description: ""
    name: IMAGE_DIGEST
    value: $(tasks.build-image-index.results.IMAGE_DIGEST)
  - description: ""
    name: CHAINS-GIT_URL
    value: $(tasks.clone-repository.results.url)
  - description: ""
    name: CHAINS-GIT_COMMIT
    value: $(tasks.clone-repository.results.commit)
  tasks:
  - name: init
    params:
    - name: enable-cache-proxy
      value: $(params.enable-cache-proxy)
    taskRef:
      params:
      - name: name
        value: init
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-init:0.4@sha256:5a423246792ac501ea279229b42ee57da9927da441c04b5c9ff86817b0856b08
      - name: kind
        value: task
      resolver: bundles
  - name: evals-skip-decision
    runAfter:
    - init
    workspaces:
    - name: basic-auth
      workspace: git-auth
    params:
    - name: evals-skip-keyword
      value: $(params.evals-skip-keyword)
    - name: evals-skip-github-owner
      value: $(params.evals-skip-github-owner)
    - name: evals-skip-github-repo
      value: $(params.evals-skip-github-repo)
    - name: evals-skip-pull-request-number
      value: $(params.evals-skip-pull-request-number)
    taskSpec:
      description: Match evals-skip-keyword against the PR body from the GitHub API (owner/repo/PR from PaC; token from git-auth).
      workspaces:
      - name: basic-auth
        optional: true
      params:
      - name: evals-skip-keyword
        type: string
      - name: evals-skip-github-owner
        type: string
      - name: evals-skip-github-repo
        type: string
      - name: evals-skip-pull-request-number
        type: string
      results:
      - description: 'true if EaaS provisioning and run-evals should be skipped'
        name: skip-evals
        type: string
      steps:
      - name: decide
        image: registry.access.redhat.com/ubi9/ubi:latest
        env:
        - name: EVALS_SKIP_KEYWORD
          value: $(params.evals-skip-keyword)
        - name: EVALS_SKIP_GITHUB_OWNER
          value: $(params.evals-skip-github-owner)
        - name: EVALS_SKIP_GITHUB_REPO
          value: $(params.evals-skip-github-repo)
        - name: EVALS_SKIP_PR_NUMBER
          value: $(params.evals-skip-pull-request-number)
        - name: GIT_AUTH_DIR
          value: $(workspaces.basic-auth.path)
        script: |
          #!/bin/bash -v
          set -euo pipefail
          if [ -z "${EVALS_SKIP_KEYWORD:-}" ]; then
            echo -n false > $(results.skip-evals.path)
            exit 0
          fi
          SEARCH=""
          if [ -n "${EVALS_SKIP_GITHUB_OWNER:-}" ] && [ -n "${EVALS_SKIP_GITHUB_REPO:-}" ] && [ -n "${EVALS_SKIP_PR_NUMBER:-}" ]; then
            TOKEN=""
            if [ -n "${GIT_AUTH_DIR:-}" ] && [ -f "${GIT_AUTH_DIR}/.git-credentials" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [[ "$line" == *github.com* ]] || continue
                if [[ "$line" =~ https://[^:]+:([^@]+)@ ]]; then
                  TOKEN="${BASH_REMATCH[1]}"
                  break
                fi
              done < "${GIT_AUTH_DIR}/.git-credentials"
            fi
            URL="https://api.github.com/repos/${EVALS_SKIP_GITHUB_OWNER}/${EVALS_SKIP_GITHUB_REPO}/pulls/${EVALS_SKIP_PR_NUMBER}"
            TMP="$(mktemp)"
            CURL=(curl -sS -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
            [ -z "$TOKEN" ] || CURL+=(-H "Authorization: Bearer ${TOKEN}")
            set +e
            HTTP_CODE=$("${CURL[@]}" -o "$TMP" -w '%{http_code}' "$URL")
            RC=$?
            set -e
            if [ "$RC" != 0 ] || [ "$HTTP_CODE" != "200" ]; then
              if [ -n "$TOKEN" ] && [ "$HTTP_CODE" = "401" ]; then
                set +e
                HTTP_CODE=$(curl -sS -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Authorization: token ${TOKEN}" -o "$TMP" -w '%{http_code}' "$URL")
                set -e
              fi
            fi
            if [ "$HTTP_CODE" = "200" ]; then
              SEARCH=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('body') or '')" "$TMP" 2>/dev/null) || SEARCH=""
            fi
            rm -f "$TMP"
          fi
          if [ -z "$SEARCH" ]; then
            echo -n false > $(results.skip-evals.path)
            exit 0
          fi
          if printf '%s' "$SEARCH" | grep -Fq -- "$EVALS_SKIP_KEYWORD"; then
            echo -n true > $(results.skip-evals.path)
          else
            echo -n false > $(results.skip-evals.path)
          fi
  - name: clone-repository
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
    - name: depth
      value: 0     # needed for mergeTargetBranch to work (artificial merge conflicts are reported without this)
    - name: fetchTags
      value: true
    - name: mergeTargetBranch
      value: true
    - name: ociStorage
      value: $(params.output-image).git
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:13d49df7dc9ae301627e45f95a236011422996152f1bea46cd60217b0f057407
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: basic-auth
      workspace: git-auth
  - name: prefetch-dependencies
    params:
    - name: input
      value: $(params.prefetch-input)
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
    - name: ociStorage
      value: $(params.output-image).prefetch
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    - name: enable-package-registry-proxy
      value: $(params.enable-package-registry-proxy)
    runAfter:
    - clone-repository
    taskRef:
      params:
      - name: name
        value: prefetch-dependencies-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.3@sha256:a2efbcdcecfa5293a622eb356a18f5c88e5714046b214fe8730b43b1a7dbb77d
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: git-basic-auth
      workspace: git-auth
    - name: netrc
      workspace: netrc
  - name: read-git-tags
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    runAfter:
    - prefetch-dependencies
    taskSpec:
      description: Read git tags pointing at HEAD and generate image labels based on them.  Moreover, when the git tag pointing at HEAD is a version string (containing digits and dots only), generate the :stable image tag.
      params: [name: SOURCE_ARTIFACT]
      results: [{name: IMAGE_LABELS, type: array, description: Image labels implied by git tags.}]
      volumes: [{name: workdir, emptyDir: {}}]
      stepTemplate: {volumeMounts: [{name: workdir, mountPath: /var/workdir}]}
      steps:
      - name: use-trusted-artifact
        image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:a246cf2267fe6fa68ae8885c6ca4141923edca3ccf9b56838d1ebe369d31b46d
        args: [use, $(params.SOURCE_ARTIFACT)=/var/workdir/source]
      - name: git-tags-to-image-labels
        image: registry.fedoraproject.org/fedora-toolbox:latest@sha256:74f8f5922400df0d3eedf1c449d5265538a80a82ca7f6b3767f2d1215dcd2bf9
        workingDir: /var/workdir/source
        script: |
          #!/bin/bash -ex
          git describe --tags
          tags="$(git tag --points-at HEAD | tr '\n' ,)"
          if [[ -z "$tags" ]]; then
            echo "[]" > "$(results.IMAGE_LABELS.path)"
          else
            [[ "$tags" =~ ^[0-9.]+,$ ]] && tags="stable,${tags}"
            printf '["%s"]' "konflux.additional-tags=${tags%,}" | tee "$(results.IMAGE_LABELS.path)"
          fi
  - name: build-container
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: BUILD_ARGS_FILE
      value: $(params.build-args-file)
    - name: PRIVILEGED_NESTED
      value: $(params.privileged-nested)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    - name: LABELS
      value: $(tasks.read-git-tags.results.IMAGE_LABELS)
    - name: HTTP_PROXY
      value: $(tasks.init.results.http-proxy)
    - name: NO_PROXY
      value: $(tasks.init.results.no-proxy)
    runAfter:
    - read-git-tags
    taskRef:
      params:
      - name: name
        value: buildah-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.9@sha256:681d9f65a7f50cb260ee576ccab551e11d63c549f1e1ef3d201da3c112855bd6
      - name: kind
        value: task
      resolver: bundles
  - name: build-image-index
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: ALWAYS_BUILD_INDEX
      value: $(params.build-image-index)
    - name: IMAGES
      value:
      - $(tasks.build-container.results.IMAGE_URL)@$(tasks.build-container.results.IMAGE_DIGEST)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    runAfter:
    - build-container
    taskRef:
      params:
      - name: name
        value: build-image-index
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3@sha256:550afde50349e22ec11191ea0db9a49395ab46fef4e8317d820b6e946677ebeb
      - name: kind
        value: task
      resolver: bundles
  - name: build-source-image
    params:
    - name: BINARY_IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: BINARY_IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: source-build-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-source-build-oci-ta:0.3@sha256:0917cfc7772e82cb8e74743c2104f43bcf2596aceafe87eec6fce69a8cac5f06
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.build-source-image)
      operator: in
      values:
      - "true"
  - name: deprecated-base-image-check
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: deprecated-image-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:e78d0d3baf3c8cfc1a5ad278196b74032d9568b143a87c7a79ab780fedfb296e
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: clair-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clair-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clair-scan:0.3@sha256:8fad4c2e2f470f82ee43d6b2ac72327b4d9c6e9cb514a678911c1c9359c29894
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: ecosystem-cert-preflight-checks
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: ecosystem-cert-preflight-checks
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.2@sha256:9c300728a03f41beee9a689422d66513d32ab5f804664fe561b11cebacd07799
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-snyk-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-snyk-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.4@sha256:8f3ecbeaff579e41b8278f82d7fabac27845db17a8e687ea6c510c0c9aceabbb
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: clamav-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clamav-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3@sha256:567cb66bd2e1f4b58b9d4d756f3317fc62479e0b40aa0de66094b1f12d296cfc
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-shell-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: IMP_FINDINGS_ONLY
      value: "false"
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-shell-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta:0.1@sha256:c4ef47e3b4e0508572d266fb745be7e374c29dc02580328cbe9f4d472a8aca57
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-unicode-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-unicode-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta:0.4@sha256:90efa582de7770d55102b74014a765cd16a25a56f2cf644b56a788c70c4dc749
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: apply-tags
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: ADDITIONAL_TAGS
      value: $(params.ADDITIONAL_TAGS[*])
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: apply-tags
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3@sha256:a291081de7fb27f832c6fc3c4b078acf7e6162ca4c085db38b118ca87e8b5b66
      - name: kind
        value: task
      resolver: bundles
  - name: push-dockerfile
    params:
    - name: IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: push-dockerfile-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-push-dockerfile-oci-ta:0.3@sha256:7855471abfe87de080b914f2f3ca27c59e64f6448a7c2435e51435b764494c71
      - name: kind
        value: task
      resolver: bundles
  - name: rpms-signature-scan
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: rpms-signature-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-rpms-signature-scan:0.2@sha256:d4e3499ad4af6869470233bef6faaa1bdd69ef56276841eeec93ce6e62deeb93
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: provision-eaas-space
    # provision an ephemeral namespace where we can deploy the newly built container image
    runAfter:
    - evals-skip-decision
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(tasks.evals-skip-decision.results.skip-evals)
      operator: in
      values:
      - "false"
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/konflux-ci/build-definitions.git
      - name: revision
        value: main
      - name: pathInRepo
        value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
    params:
    - name: ownerName
      value: $(context.pipelineRun.name)
    - name: ownerUid
      value: $(context.pipelineRun.uid)
  - name: run-evals
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    - provision-eaas-space
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(tasks.evals-skip-decision.results.skip-evals)
      operator: in
      values:
      - "false"
    taskSpec:
      description: Try to deploy the newly built container image in a pod in the ephemeral namespace and run evals on it.
      params:
      - name: image-url
        type: string
      volumes:
      - name: eaas-space
        secret:
          secretName: $(tasks.provision-eaas-space.results.secretRef)
      steps:
      - name: run
        image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.20
        volumeMounts:
        - name: eaas-space
          mountPath: /var/run/eaas-space
          readOnly: true
        script: |
          #!/bin/bash -ex
          set -o pipefail
          dnf install -y jq
          export KUBECONFIG="/var/run/eaas-space/kubeconfig"

          # transfer the gemini-key secret to the ephemeral namespace
          { KUBECONFIG= oc get secret gemini-key -o json \
            | jq 'del(.metadata.namespace, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp)' \
            | oc apply -f - \
            || { EC=$?; echo gemini-key secret not available; exit $EC; }
          } 2>/dev/null

          # define a one-shot pod
          tee aegis-eval.yaml << EOF
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            generateName: aegis-ai-eval
          spec:
            restartPolicy: Never
            containers:
            - name: aegis-eval-container
              image: $(params.image-url)
              command: ["make", "eval"]
              env:
                # make the tables in pydantic-eval reports readable
                - name: COLUMNS
                  value: "512"
                # enable colorized text when output is redirected
                - name: PYTEST_ADDOPTS
                  value: "--color=yes"
                - name: AEGIS_LLM_HOST
                  value: "https://generativelanguage.googleapis.com"
                - name: AEGIS_LLM_MODEL
                  value: "gemini-2.5-flash"
                - name: AEGIS_LLM_MAX_JOBS
                  value: "8"
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gemini-key
                      key: token
                - name: AEGIS_USE_KERNEL_CLASSIFIER
                  value: "true"
              resources:
                requests:
                  memory: "2Gi"
                  cpu: 1
                limits:
                  memory: "4Gi"
                  cpu: 2
          EOF

          # create the pod in the ephemeral namespace and monitor it
          oc create -f aegis-eval.yaml -o json | jq -r .metadata.name | tee pod-name.txt
          oc wait --for=condition=Ready --timeout=300s "pod/$(<pod-name.txt)" || oc get pods
          oc logs -f "$(<pod-name.txt)"
          EC_JSON_PATH=".status.containerStatuses[0].state.terminated.exitCode"
          oc wait --for="jsonpath={$EC_JSON_PATH}" --timeout=30s "pod/$(<pod-name.txt)" || oc get pods
          EC=$(oc get -o json "pod/$(<pod-name.txt)" | jq "$EC_JSON_PATH")
          test 0 -le "$EC" || EC=$?
          oc delete pod "$(<pod-name.txt)"
          exit "$EC"
  workspaces:
  - name: git-auth
    optional: true
  - name: netrc
    optional: true
