apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: aegis-build-pipeline
spec:
  description: |
    This pipeline is ideal for building container images from a Containerfile while maintaining trust after pipeline customization.

    _Uses `buildah` to create a container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
    This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-oci-ta?tab=tags)_
  params:
  - description: Source Repository URL
    name: git-url
    type: string
  - default: ""
    description: Revision of the Source Repository
    name: revision
    type: string
  - description: Fully Qualified Output Image
    name: output-image
    type: string
  - default: .
    description: Path to the source code of an application's component from where to build image.
    name: path-context
    type: string
  - default: Containerfile.eval
    description: Path to the Dockerfile inside the context specified by parameter path-context
    name: dockerfile
    type: string
  - default: "false"
    description: Skip checks against built image
    name: skip-checks
    type: string
  - default: "false"
    description: Execute the build with network isolation
    name: hermetic
    type: string
  - default: ""
    description: Build dependencies to be prefetched
    name: prefetch-input
    type: string
  - default: ""
    description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: image-expires-after
    type: string
  - default: "false"
    description: Build a source image.
    name: build-source-image
    type: string
  - default: "false"
    description: Add built image into an OCI image index
    name: build-image-index
    type: string
  - default: []
    description: Array of --build-arg values ("arg=value" strings) for buildah
    name: build-args
    type: array
  - default: ""
    description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
    name: build-args-file
    type: string
  - default: "false"
    description: Whether to enable privileged mode, should be used only with remote VMs
    name: privileged-nested
    type: string
  - name: ADDITIONAL_TAGS
    description: Additional tags that will be applied to the image in the registry.
    type: array
    default: []
  - name: buildah-format
    default: docker
    type: string
    description: The format for the resulting image's mediaType. Valid values are oci or docker.
  - name: enable-cache-proxy
    default: 'false'
    description: Enable cache proxy configuration
    type: string
  - name: evals-skip-keyword
    default: ""
    description: Substring that skips evals when found in the PR body (GitHub API). Empty disables; set on PR runs only.
    type: string
  - name: evals-skip-github-owner
    default: ""
    description: PaC template repo_owner (PR runs).
    type: string
  - name: evals-skip-github-repo
    default: ""
    description: PaC template repo_name (PR runs).
    type: string
  - name: evals-skip-pull-request-number
    default: ""
    description: PaC template pull_request_number (PR runs).
    type: string
  - name: enable-package-registry-proxy
    default: 'true'
    description: Use the package registry proxy when prefetching dependencies
    type: string
  - name: apply-git-tag-labels
    type: string
    default: "false"
    description: Whether to generate image labels from git tags pointing at HEAD. Set to true on push pipelines only.
  - name: source-date-epoch
    type: string
    default: ''
    description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
  - name: rewrite-timestamp
    type: string
    default: 'false'
    description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
  - name: omit-history
    type: string
    default: 'false'
    description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
  results:
  - description: ""
    name: IMAGE_URL
    value: $(tasks.build-image-index.results.IMAGE_URL)
  - description: ""
    name: IMAGE_DIGEST
    value: $(tasks.build-image-index.results.IMAGE_DIGEST)
  - description: ""
    name: CHAINS-GIT_URL
    value: $(tasks.clone-repository.results.url)
  - description: ""
    name: CHAINS-GIT_COMMIT
    value: $(tasks.clone-repository.results.commit)
  tasks:
  - name: init
    params:
    - name: enable-cache-proxy
      value: $(params.enable-cache-proxy)
    taskRef:
      params:
      - name: name
        value: init
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:b8465d543589b1238f6911626657f5766e279a0f33a5f70de68073401e031184
      - name: kind
        value: task
      resolver: bundles
  - name: evals-skip-decision
    runAfter:
    - init
    workspaces:
    - name: basic-auth
      workspace: git-auth
    params:
    - name: evals-skip-keyword
      value: $(params.evals-skip-keyword)
    - name: evals-skip-github-owner
      value: $(params.evals-skip-github-owner)
    - name: evals-skip-github-repo
      value: $(params.evals-skip-github-repo)
    - name: evals-skip-pull-request-number
      value: $(params.evals-skip-pull-request-number)
    taskSpec:
      description: Match evals-skip-keyword against the PR body from the GitHub API (owner/repo/PR from PaC; token from git-auth).
      workspaces:
      - name: basic-auth
        optional: true
      params:
      - name: evals-skip-keyword
        type: string
      - name: evals-skip-github-owner
        type: string
      - name: evals-skip-github-repo
        type: string
      - name: evals-skip-pull-request-number
        type: string
      results:
      - description: 'true if EaaS provisioning and run-evals should be skipped'
        name: skip-evals
        type: string
      steps:
      - name: decide
        image: registry.access.redhat.com/ubi9/ubi:latest
        env:
        - name: EVALS_SKIP_KEYWORD
          value: $(params.evals-skip-keyword)
        - name: EVALS_SKIP_GITHUB_OWNER
          value: $(params.evals-skip-github-owner)
        - name: EVALS_SKIP_GITHUB_REPO
          value: $(params.evals-skip-github-repo)
        - name: EVALS_SKIP_PR_NUMBER
          value: $(params.evals-skip-pull-request-number)
        - name: GIT_AUTH_DIR
          value: $(workspaces.basic-auth.path)
        script: |
          #!/bin/bash -v
          set -euo pipefail
          if [ -z "${EVALS_SKIP_KEYWORD:-}" ]; then
            echo -n false > $(results.skip-evals.path)
            exit 0
          fi
          SEARCH=""
          if [ -n "${EVALS_SKIP_GITHUB_OWNER:-}" ] && [ -n "${EVALS_SKIP_GITHUB_REPO:-}" ] && [ -n "${EVALS_SKIP_PR_NUMBER:-}" ]; then
            TOKEN=""
            if [ -n "${GIT_AUTH_DIR:-}" ] && [ -f "${GIT_AUTH_DIR}/.git-credentials" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [[ "$line" == *github.com* ]] || continue
                if [[ "$line" =~ https://[^:]+:([^@]+)@ ]]; then
                  TOKEN="${BASH_REMATCH[1]}"
                  break
                fi
              done < "${GIT_AUTH_DIR}/.git-credentials"
            fi
            URL="https://api.github.com/repos/${EVALS_SKIP_GITHUB_OWNER}/${EVALS_SKIP_GITHUB_REPO}/pulls/${EVALS_SKIP_PR_NUMBER}"
            TMP="$(mktemp)"
            CURL=(curl -sS -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
            [ -z "$TOKEN" ] || CURL+=(-H "Authorization: Bearer ${TOKEN}")
            set +e
            HTTP_CODE=$("${CURL[@]}" -o "$TMP" -w '%{http_code}' "$URL")
            RC=$?
            set -e
            if [ "$RC" != 0 ] || [ "$HTTP_CODE" != "200" ]; then
              if [ -n "$TOKEN" ] && [ "$HTTP_CODE" = "401" ]; then
                set +e
                HTTP_CODE=$(curl -sS -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Authorization: token ${TOKEN}" -o "$TMP" -w '%{http_code}' "$URL")
                set -e
              fi
            fi
            if [ "$HTTP_CODE" = "200" ]; then
              SEARCH=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('body') or '')" "$TMP" 2>/dev/null) || SEARCH=""
            fi
            rm -f "$TMP"
          fi
          if [ -z "$SEARCH" ]; then
            echo -n false > $(results.skip-evals.path)
            exit 0
          fi
          if printf '%s' "$SEARCH" | grep -Fq -- "$EVALS_SKIP_KEYWORD"; then
            echo -n true > $(results.skip-evals.path)
          else
            echo -n false > $(results.skip-evals.path)
          fi
  - name: clone-repository
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
    - name: depth
      value: 0     # needed for mergeTargetBranch to work (artificial merge conflicts are reported without this)
    - name: fetchTags
      value: true
    - name: mergeTargetBranch
      value: true
    - name: ociStorage
      value: $(params.output-image).git
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.5@sha256:510daad5648d37936b9b2c599a35c8e59b7389de8e1a4e58f6c6d079957d730d
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: basic-auth
      workspace: git-auth
  - name: prefetch-dependencies
    params:
    - name: input
      value: $(params.prefetch-input)
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
    - name: ociStorage
      value: $(params.output-image).prefetch
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    - name: enable-package-registry-proxy
      value: $(params.enable-package-registry-proxy)
    runAfter:
    - clone-repository
    taskRef:
      params:
      - name: name
        value: prefetch-dependencies-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.6.0@sha256:01158b939522c276ba36804c2cc7ef641a572fb6c27f001819ea287dd708cd13
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: git-basic-auth
      workspace: git-auth
    - name: netrc
      workspace: netrc
  - name: read-git-tags
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: APPLY_GIT_TAG_LABELS
      value: $(params.apply-git-tag-labels)
    runAfter:
    - prefetch-dependencies
    taskSpec:
      description: Read git tags pointing at HEAD and generate image labels based on them.  Moreover, when the git tag pointing at HEAD is a version string (containing digits and dots only), generate the :stable image tag.
      params: [{name: SOURCE_ARTIFACT}, {name: APPLY_GIT_TAG_LABELS}]
      results: [{name: IMAGE_LABELS, type: array, description: Image labels implied by git tags.}]
      volumes: [{name: workdir, emptyDir: {}}]
      stepTemplate: {volumeMounts: [{name: workdir, mountPath: /var/workdir}]}
      steps:
      - name: use-trusted-artifact
        image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:0fa7f2a5cd87d6d47ac5dbedc81687805c8e6bc24c6aca620242e9134eed9633
        args: [use, $(params.SOURCE_ARTIFACT)=/var/workdir/source]
      - name: git-tags-to-image-labels
        image: registry.fedoraproject.org/fedora-toolbox:latest@sha256:320667ea56e4cf3085bdcac5c83344e88dcef1af669033eeecbc6277e7a032b8
        workingDir: /var/workdir/source
        env:
        - name: APPLY_GIT_TAG_LABELS
          value: $(params.APPLY_GIT_TAG_LABELS)
        script: |
          #!/bin/bash -ex
          git describe --tags
          if [[ "$APPLY_GIT_TAG_LABELS" != "true" ]]; then
            echo "[]" > "$(results.IMAGE_LABELS.path)"
            exit 0
          fi
          tags="$(git tag --points-at HEAD | tr '\n' ,)"
          if [[ -z "$tags" ]]; then
            echo "[]" > "$(results.IMAGE_LABELS.path)"
          else
            [[ "$tags" =~ ^[0-9.]+,$ ]] && tags="stable,${tags}"
            printf '["%s"]' "konflux.additional-tags=${tags%,}" | tee "$(results.IMAGE_LABELS.path)"
          fi
  - name: build-container
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: BUILD_ARGS_FILE
      value: $(params.build-args-file)
    - name: PRIVILEGED_NESTED
      value: $(params.privileged-nested)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    - name: LABELS
      value: $(tasks.read-git-tags.results.IMAGE_LABELS)
    - name: HTTP_PROXY
      value: $(tasks.init.results.http-proxy)
    - name: NO_PROXY
      value: $(tasks.init.results.no-proxy)
    - name: SOURCE_DATE_EPOCH
      value: $(params.source-date-epoch)
    - name: REWRITE_TIMESTAMP
      value: $(params.rewrite-timestamp)
    - name: OMIT_HISTORY
      value: $(params.omit-history)
    runAfter:
    - read-git-tags
    taskRef:
      params:
      - name: name
        value: buildah-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.10.7@sha256:f07fccbe8d952ba2e9e5f3b8b8bfcda2cc8037d5153cf19da7d5ed0bb8b431a8
      - name: kind
        value: task
      resolver: bundles
  - name: build-image-index
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: ALWAYS_BUILD_INDEX
      value: $(params.build-image-index)
    - name: IMAGES
      value:
      - $(tasks.build-container.results.IMAGE_URL)@$(tasks.build-container.results.IMAGE_DIGEST)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    runAfter:
    - build-container
    taskRef:
      params:
      - name: name
        value: build-image-index
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3.1@sha256:a355355b7fcd0ba8de4ba85a162a2e6893f53236b943f79cb03ae0ae9c5ef53c
      - name: kind
        value: task
      resolver: bundles
  - name: build-source-image
    params:
    - name: BINARY_IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: BINARY_IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: source-build-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-source-build-oci-ta:0.3@sha256:6081c4167e87a9167f7db4cda9ff0110607b7b9fc404c3daa076247475a4affa
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.build-source-image)
      operator: in
      values:
      - "true"
  - name: deprecated-base-image-check
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: deprecated-image-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:0ccc688a77e9b7b0b8973c132a1e840844137e77f887be4a0bec8893b0776872
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: clair-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clair-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clair-scan:0.3.2@sha256:f5b4415db9ac1fba3e11d993a617e0b275d1f0ed2fc669b12c400ed848c39174
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: ecosystem-cert-preflight-checks
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: ecosystem-cert-preflight-checks
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.2@sha256:27c9760ad11c74ad010d9615ee15348e3674843166acb7686929b3ef6840416c
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-snyk-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-snyk-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.5@sha256:eba24f5d9f4b18aa71e523b9b3dbcf22982aa4b018824260a090b19dfc9abf6f
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: clamav-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clamav-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.1@sha256:53a02326bfb930ca5ef6bfa7a33acca833d57752f34f3cb79255fe2e25e7d217
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-shell-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    - name: IMP_FINDINGS_ONLY
      value: "false"
    - name: TARGET_DIRS  # avoid scanning .git and .venv
      value: docs,evals,scripts,src,tests
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-shell-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta:0.1@sha256:61b27e6ad5daba761d41bb37efb790ed98380603fd4fe2f86d156def5bd72ecc
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-unicode-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-unicode-check-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta:0.4@sha256:eb9d5392f215cb8b52b16382098cac4885b1e6cd989f88ebd83fdb234d283eb9
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-report
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - sast-snyk-check
    - sast-shell-check
    - sast-unicode-check
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    taskSpec:
      description: >-
        Discover SARIF artifacts attached to the built image by the SAST tasks,
        pull them, parse findings, log a human-readable summary, and fail the
        pipeline when error-level findings are present.
      params:
      - name: image-url
        type: string
      - name: image-digest
        type: string
      steps:
      - name: report
        image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:470ce04569ca7219f30dfdccdd282ed4f47201b344b05c67a3497ddcd967e2b3
        env:
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
        script: |
          #!/bin/bash
          set -euo pipefail

          command -v oras >/dev/null || { echo "ERROR: oras not found in image"; exit 1; }
          command -v jq >/dev/null || { echo "ERROR: jq not found in image"; exit 1; }
          HAS_CSGREP=false
          command -v csgrep >/dev/null && HAS_CSGREP=true

          [ -n "$IMAGE_URL" ] && [ -n "$IMAGE_DIGEST" ] || {
            echo "ERROR: IMAGE_URL or IMAGE_DIGEST is empty"; exit 1
          }
          IMAGE_REF="${IMAGE_URL}@${IMAGE_DIGEST}"
          echo "=========================================="
          echo "SAST Report for ${IMAGE_REF}"
          echo "=========================================="

          DISCOVER_ERR=$(mktemp)
          DISCOVER_JSON=$(oras discover --format json "$IMAGE_REF" 2>"$DISCOVER_ERR") || {
            echo "ERROR: oras discover failed."
            cat "$DISCOVER_ERR"
            rm -f "$DISCOVER_ERR"
            exit 1
          }
          rm -f "$DISCOVER_ERR"

          if ! SARIF_REFS=$(echo "$DISCOVER_JSON" | jq -r --arg base "$IMAGE_URL" '
            [(.referrers // .manifests // [])[]
             | select(.artifactType == "application/sarif+json")
             | (.reference // ($base + "@" + .digest))]
            | .[]
          '); then
            echo "ERROR: Failed to parse oras discover output."
            echo "Raw output:"
            echo "$DISCOVER_JSON"
            exit 1
          fi

          if [ -z "$SARIF_REFS" ]; then
            echo "No SARIF artifacts found attached to the image."
            echo "SAST tasks may have been skipped or produced no output."
            exit 0
          fi

          SARIF_COUNT=$(echo "$SARIF_REFS" | wc -l)
          echo "Found ${SARIF_COUNT} SARIF artifact(s)."
          echo ""

          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT
          TOTAL_ERRORS=0
          TOTAL_WARNINGS=0
          TOTAL_NOTES=0
          PULL_FAILURES=0

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            PULL_DIR=$(mktemp -d "${WORKDIR}/sarif-XXXXXX")
            echo "------------------------------------------"
            echo "Pulling: ${ref}"
            if ! oras pull -o "$PULL_DIR" "$ref" 2>&1; then
              echo "ERROR: Failed to pull ${ref}."
              PULL_FAILURES=$((PULL_FAILURES + 1))
              continue
            fi

            for sarif_file in "$PULL_DIR"/*; do
              [ -f "$sarif_file" ] || continue
              jq -e '.runs' "$sarif_file" >/dev/null 2>&1 || continue
              FILENAME=$(basename "$sarif_file")
              TOOL_NAME=$(jq -r '.runs[0].tool.driver.name // "unknown"' "$sarif_file" 2>/dev/null) || TOOL_NAME="unknown"
              ERRORS=$(jq '[.runs[] | (.results // [])[] | select(.level == "error")] | length' "$sarif_file" 2>/dev/null) || ERRORS=0
              WARNINGS=$(jq '[.runs[] | (.results // [])[] | select(.level == "warning" or .level == null)] | length' "$sarif_file" 2>/dev/null) || WARNINGS=0
              NOTES=$(jq '[.runs[] | (.results // [])[] | select(.level == "note" or .level == "none")] | length' "$sarif_file" 2>/dev/null) || NOTES=0
              TOTAL_RESULTS=$(jq '[.runs[] | (.results // [])[]] | length' "$sarif_file" 2>/dev/null) || TOTAL_RESULTS=0

              echo ""
              echo "  File: ${FILENAME}"
              echo "  Tool: ${TOOL_NAME}"
              echo "  Total findings: ${TOTAL_RESULTS}"
              echo "    Errors:   ${ERRORS}"
              echo "    Warnings: ${WARNINGS}"
              echo "    Notes:    ${NOTES}"

              if [ "$TOTAL_RESULTS" -gt 0 ]; then
                echo ""
                CSGREP_OK=false
                if [ "$HAS_CSGREP" = true ]; then
                  echo "  Findings:"
                  if ! csgrep --mode=sarif "$sarif_file" 2>/dev/null | sed 's/^/    /'; then
                    echo "    (csgrep failed, falling back to jq)"
                    CSGREP_OK=false
                  else
                    CSGREP_OK=true
                  fi
                fi
                if [ "$CSGREP_OK" = false ]; then
                  [ "$HAS_CSGREP" = true ] || echo "  Findings:"
                  jq -r '.runs[] | (.results // [])[] |
                    "    \(.level // "warning"): [\(.ruleId // "no-rule")] \(.locations[0].physicalLocation.artifactLocation.uri // "unknown-file"):\(.locations[0].physicalLocation.region.startLine // "?") \(.message.text // "no message" | split("\n") | .[0])"
                  ' "$sarif_file" 2>/dev/null || true
                fi
              fi

              TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
              TOTAL_WARNINGS=$((TOTAL_WARNINGS + WARNINGS))
              TOTAL_NOTES=$((TOTAL_NOTES + NOTES))
            done
          done <<< "$SARIF_REFS"

          echo ""
          echo "=========================================="
          echo "SAST Summary"
          echo "=========================================="
          echo "  Total errors:   ${TOTAL_ERRORS}"
          echo "  Total warnings: ${TOTAL_WARNINGS}"
          echo "  Total notes:    ${TOTAL_NOTES}"
          echo "=========================================="

          if [ "$PULL_FAILURES" -gt 0 ]; then
            echo ""
            echo "FAILED: ${PULL_FAILURES} SARIF artifact(s) could not be retrieved."
            exit 1
          fi

          if [ "$TOTAL_ERRORS" -gt 0 ]; then
            echo ""
            echo "FAILED: ${TOTAL_ERRORS} error-level SAST finding(s) detected."
            echo "Review the findings above and fix them before merging."
            exit 1
          fi

          echo ""
          echo "PASSED: No error-level SAST findings."
          exit 0
  - name: apply-tags
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: ADDITIONAL_TAGS
      value: $(params.ADDITIONAL_TAGS[*])
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: apply-tags
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3@sha256:6387614ae4f9efa8abb7c4175db0ce5d958bc2b90665b4704880e46fbe0535bf
      - name: kind
        value: task
      resolver: bundles
  - name: push-dockerfile
    params:
    - name: IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: SOURCE_ARTIFACT
      value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: push-dockerfile-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-push-dockerfile-oci-ta:0.3.1@sha256:5393bada94051f02aa971ff773b130928e01ac595b9ce3bbbd69899751ed8222
      - name: kind
        value: task
      resolver: bundles
  - name: rpms-signature-scan
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: rpms-signature-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-rpms-signature-scan:0.2.1@sha256:ccb77d1bf7627fc6241a59ed42bb6e5707a8682754fe8ae18f2cfdddbcf29275
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: provision-eaas-space
    # provision an ephemeral namespace where we can deploy the newly built container image
    runAfter:
    - evals-skip-decision
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(tasks.evals-skip-decision.results.skip-evals)
      operator: in
      values:
      - "false"
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/konflux-ci/build-definitions.git
      - name: revision
        value: main
      - name: pathInRepo
        value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
    params:
    - name: ownerName
      value: $(context.pipelineRun.name)
    - name: ownerUid
      value: $(context.pipelineRun.uid)
  - name: run-evals
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    - provision-eaas-space
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(tasks.evals-skip-decision.results.skip-evals)
      operator: in
      values:
      - "false"
    taskSpec:
      description: Try to deploy the newly built container image in a pod in the ephemeral namespace and run evals on it.
      params:
      - name: image-url
        type: string
      volumes:
      - name: eaas-space
        secret:
          secretName: $(tasks.provision-eaas-space.results.secretRef)
      steps:
      - name: run
        image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.20
        volumeMounts:
        - name: eaas-space
          mountPath: /var/run/eaas-space
          readOnly: true
        script: |
          #!/bin/bash -ex
          set -o pipefail
          dnf install -y jq
          export KUBECONFIG="/var/run/eaas-space/kubeconfig"

          # transfer the gemini-key secret to the ephemeral namespace
          { KUBECONFIG= oc get secret gemini-key -o json \
            | jq 'del(.metadata.namespace, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp)' \
            | oc apply -f - \
            || { EC=$?; echo gemini-key secret not available; exit $EC; }
          } 2>/dev/null

          # define a one-shot pod
          tee aegis-eval.yaml << EOF
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            generateName: aegis-ai-eval
          spec:
            restartPolicy: Never
            containers:
            - name: aegis-eval-container
              image: $(params.image-url)
              command: ["make", "eval"]
              env:
                # make the tables in pydantic-eval reports readable
                - name: COLUMNS
                  value: "512"
                # enable colorized text when output is redirected
                - name: PYTEST_ADDOPTS
                  value: "--color=yes"
                - name: AEGIS_LLM_HOST
                  value: "https://generativelanguage.googleapis.com"
                - name: AEGIS_LLM_MODEL
                  value: "gemini-2.5-flash"
                - name: AEGIS_LLM_MAX_JOBS
                  value: "8"
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gemini-key
                      key: token
                - name: AEGIS_USE_KERNEL_CLASSIFIER
                  value: "true"
                - name: AEGIS_USE_EXT_REFS_TOOL_CONTEXT
                  value: "true"
              resources:
                requests:
                  memory: "2Gi"
                  cpu: 1
                limits:
                  memory: "4Gi"
                  cpu: 2
          EOF

          # create the pod in the ephemeral namespace and monitor it
          oc create -f aegis-eval.yaml -o json | jq -r .metadata.name | tee pod-name.txt
          oc wait --for=condition=Ready --timeout=300s "pod/$(<pod-name.txt)" || oc get pods
          oc logs -f "$(<pod-name.txt)"
          EC_JSON_PATH=".status.containerStatuses[0].state.terminated.exitCode"
          oc wait --for="jsonpath={$EC_JSON_PATH}" --timeout=30s "pod/$(<pod-name.txt)" || oc get pods
          EC=$(oc get -o json "pod/$(<pod-name.txt)" | jq "$EC_JSON_PATH")
          test 0 -le "$EC" || EC=$?
          oc delete pod "$(<pod-name.txt)"
          exit "$EC"
  workspaces:
  - name: git-auth
    optional: true
  - name: netrc
    optional: true
